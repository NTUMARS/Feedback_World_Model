# Real-world Peach-P&P policy (R1 Lite, right arm): agent-view + right-wrist RGB, 50 demonstrations.
# The demonstrations and the robot-side deployment code are not released; this config documents
# the policy used in the paper and can be reused with data in LeRobot v2.1 format.
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-train_loss={train_loss:.6f}.ckpt
    k: 5
    mode: min
    monitor_key: train_loss
dataloader:
  batch_size: 128
  num_workers: 0
  persistent_workers: false
  prefetch_factor: null
  pin_memory: true
  shuffle: true
dataset_obs_steps: 2
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
exp_name: default
horizon: 16
keypoint_visible_rate: 1.0
logging:
  group: null
  id: null
  mode: online
  name: ${now:%Y.%m.%d}_${now:%H.%M.%S}_policy_peach_pnp
  project: feedback_world_model_policy
  resume: true
  tags:
  - train_diffusion_unet_hybrid
  - pick_peach_50demo
  - trimmed
  - head_wrist
hydra:
  run:
    dir: data/outputs/policy/${now:%Y.%m.%d}/${now:%H.%M.%S}_peach_pnp
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: train_diffusion_unet_hybrid
obs_as_global_cond: true
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06
past_action_visible: false
policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy
  cond_predict_scale: true
  crop_shape:
  - 200
  - 200
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  eval_fixed_crop: true
  horizon: 16
  kernel_size: 5
  n_action_steps: 8
  n_groups: 8
  n_obs_steps: 2
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small
  num_inference_steps: 100
  obs_as_global_cond: true
  obs_encoder_group_norm: true
  shape_meta: &shape_meta
    action:
      shape:
      - 7
    obs:
      head_rgb:
        shape:
        - 3
        - 224
        - 224
        type: rgb
      right_wrist_rgb:
        shape:
        - 3
        - 224
        - 224
        type: rgb
      right_arm_qpos:
        shape:
        - 6
      right_gripper_qpos:
        shape:
        - 1
shape_meta: *shape_meta
task:
  dataset:
    _target_: diffusion_policy.dataset.lerobot_replay_image_dataset.LeRobotReplayImageDataset
    dataset_path: data/real/peach_pnp   # LeRobot v2.1 dataset (not released)
    horizon: 16
    n_obs_steps: 2
    pad_after: 7
    pad_before: 1
    seed: 42
    shape_meta: *shape_meta
    use_cache: true
    val_ratio: 0.0
    image_resize:
    - 224
    - 224
    feature_map:
      obs:
        right_arm_qpos:
          columns:
          - observation.state.right_arm
        right_gripper_qpos:
          columns:
          - observation.state.right_gripper
        head_rgb:
          video_key: observation.images.head_rgb
        right_wrist_rgb:
          video_key: observation.images.right_wrist_rgb
      action:
        columns:
        - action.right_arm
        - action.right_gripper
  name: pick_peach_50demo_trimmed
  task_name: pick_peach_50demo_trimmed
task_name: pick_peach_50demo_trimmed
training:
  checkpoint_every: 30
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 5000
  resume: true
  rollout_every: 20
  sample_every: 10
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
val_dataloader:
  batch_size: 128
  num_workers: 0
  persistent_workers: false
  prefetch_factor: null
  pin_memory: true
  shuffle: false
